name: Build signed WinUSB release

on:
  push:
    branches: ['feature/torne-native-integration']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: winusb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
      - name: Setup Rust for RTL-SDR helper
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed' }
          rustup target add --toolchain 1.95.0 i686-pc-windows-msvc x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust target setup failed' }
          rustup default 1.95.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }

      - name: Build both architectures and run offline tests
        shell: pwsh
        run: ./build.ps1
      - name: Sign application binaries and reject modified distributions
        run: |
          ./tools/sign-applications.ps1 -UseDriverPublisher
          ./tests/application_signature_test.ps1
      - name: Package matching committed source and verify extracted ZIP
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if($env:REF_TYPE -eq 'tag'){./tools/package-winusb.ps1 -Version $env:REF_NAME}
          else{./tools/package-winusb.ps1}
      - uses: actions/upload-artifact@v7
        with:
          name: px4_drv_winusb_signed
          path: |
            winusb/build/release/**/*.zip
            winusb/build/release/**/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: px4_drv_winusb_signed
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/**/*.zip
            release/**/SHA256SUMS.txt
