[BonDriver]
Name="PX-S1UD"
System="ISDB-T"
DriverHostPath=".\DriverHost_PX4.exe"
PipeConnectTimeout=1000
TuneTimeout=5000
NumberOfPacketsPerBuffer=1024
MaximumNumberOfBuffers=64
MinimumNumberOfBuffers=4
NumberOfBuffersToIgnoreAfterPurge=0
DisplayErrorMessage=0
FramedStream=true
; trueならBonDriverの選局ログを出力します。falseならログファイルは作成しません。
; ファイルはBonDriverを開くたびに作り直します。相対パスはこのDLLと同じフォルダを基準にします。
; DebugLogPathを省略するとDLLと同じ名前の.logへ出力します。
DebugLog=false
;DebugLogPath="BonDriver_PX-S1UD.log"

[BonDriver.ISDB-T]
ChSetPath="BonDriver_PX4-T.ChSet.txt"

; J.83B を受信する場合は、[BonDriver] と [ReceiverDefinition0] の System を "ISDB-T,J.83B" にし、
; 次の行を有効にします。DriverHost_PX4.ini の J83BFirmwarePath の設定も必要です。
;[BonDriver.J.83B]
;ChSetPath="BonDriver_PX4-J83B.ChSet.txt"

[ReceiverDefinition0]
DeviceName="PLEX PX-S1UD"
DeviceGUID="{73ad569a-2c54-4710-bf5c-812de1f9dc52}"
System="ISDB-T"
