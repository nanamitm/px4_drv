[BonDriver]
Name="XIT-SQR100"
; スカパー！プレミアムサービス光 (J.83B) を受信する際は 2つ目の System の行の先頭の ; を外し、1つ目の行の先頭に ; を付ける
; XIT-SQR100 の J.83B の受信は、J.83B の信号ではまだ確認していない
System="ISDB-T,ISDB-S"
;System="ISDB-T,ISDB-S,J.83B"
DriverHostPath=".\DriverHost_PX4.exe"
PipeConnectTimeout=1000
TuneTimeout=5000
NumberOfPacketsPerBuffer=1024
MaximumNumberOfBuffers=64
MinimumNumberOfBuffers=4
NumberOfBuffersToIgnoreAfterPurge=1
DisplayErrorMessage=0

[BonDriver.ISDB-T]
ChSetPath="BonDriver_PX4-T.ChSet.txt"

; XIT-SQR100 は BS/CS アンテナへの給電に対応していない
[BonDriver.ISDB-S]
ChSetPath="BonDriver_PX4-S.ChSet.txt"
LNBPower=0

[BonDriver.J.83B]
ChSetPath="BonDriver_PX4-J83B.ChSet.txt"

[ReceiverDefinition0]
DeviceName="PIXELA XIT-SQR100"
DeviceGUID="{610b99b4-1e98-4a34-9b96-e2b3554e5390}"
System="ISDB-T,ISDB-S,J.83B"
