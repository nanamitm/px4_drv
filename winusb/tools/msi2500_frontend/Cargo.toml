[package]
name = "msi2500_frontend"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RSP1 互換機 (MSi2500/MSi001) による ISDB-T フルセグ受信の helper"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Usb",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
